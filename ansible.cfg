[defaults]
inventory = inventory/production/hosts.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
forks = 10
timeout = 30
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600
callback_result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks
interpreter_python = auto
remote_tmp = /tmp/.ansible-${USER}/tmp
local_tmp = /tmp/.ansible-${USER}/tmp

# Security
# The inventories read their webhook URLs from vault variables. Point
# ansible-playbook at the vault with --vault-password-file or
# --ask-vault-pass; a path set here makes every run fail on hosts that
# do not have that file.
# vault_password_file = ~/.ansible/vault_pass.txt

# Performance
pipelining = True
strategy = free
poll_interval = 15
internal_poll_interval = 0.001

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o ServerAliveInterval=60
control_path = /tmp/.ansible-%%h-%%p-%%r
pipelining = True

[privilege_escalation]
become = False
become_method = sudo
become_user = root
become_ask_pass = False
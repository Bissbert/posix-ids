---
# Generate, snapshot, verify or compare IDS baselines
#   -e action=generate  re-write the monitor baseline (backs up the old one)
#   -e action=snapshot  refresh the baseline.sh -S snapshot only
#   -e action=verify    compare CRITICAL_FILES with the monitor baseline
#   -e action=compare   diff two saved monitor baselines
- name: Manage IDS baselines
  hosts: "{{ target_hosts | default('ids_servers') }}"
  become: true
  gather_facts: true

  vars:
    baseline_action: "{{ action | default('verify') }}"
    baseline_cmd: "{{ ids_base_path }}/bin/baseline.sh -c {{ ids_config_path }}/ids.conf"

  pre_tasks:
    - name: Check the requested action
      ansible.builtin.assert:
        that: baseline_action in ["generate", "snapshot", "verify", "compare"]
        fail_msg: "action must be generate, snapshot, verify or compare"
      tags: [always]

  tasks:
    - name: Re-write the monitor baseline
      ansible.builtin.include_role:
        name: ids_baseline
      vars:
        ids_baseline_regenerate: true
      when: baseline_action == "generate"
      tags: [generate]

    - name: Refresh the baseline snapshot
      ansible.builtin.command: "{{ baseline_cmd }} -S"
      register: baseline_snapshot
      when: baseline_action == "snapshot"
      tags: [snapshot]

    - name: Verify system against baseline
      block:
        - name: Run baseline verification
          ansible.builtin.command: "{{ baseline_cmd }} -V"
          register: baseline_verify
          changed_when: false
          failed_when: baseline_verify.rc > 1

        - name: Display verification results
          ansible.builtin.debug:
            msg: "{{ baseline_verify.stdout_lines }}"

        - name: Save verification report
          ansible.builtin.copy:
            content: "{{ baseline_verify.stdout }}"
            dest: "{{ ids_log_path }}/baseline_verify_{{ ansible_date_time.epoch }}.log"
            mode: "0640"
          when: baseline_verify.rc > 0
      when: baseline_action == "verify"
      tags: [verify]

    - name: Compare baselines
      block:
        - name: List saved monitor baselines
          ansible.builtin.find:
            paths: /var/lib/ids/baselines
            patterns: "*.dat"
          register: baseline_files

        - name: Display saved baselines
          ansible.builtin.debug:
            msg: "{{ item.path }}"
          loop: "{{ baseline_files.files }}"

        - name: Compare two baselines
          ansible.builtin.command:
            argv:
              - diff
              - -u
              - "{{ baseline_file1 | default(ids_baseline_file) }}"
              - "/var/lib/ids/baselines/{{ baseline_file2 }}"
          register: baseline_diff
          changed_when: false
          failed_when: baseline_diff.rc > 1
          when: baseline_file2 is defined

        - name: Display differences
          ansible.builtin.debug:
            var: baseline_diff.stdout_lines
          when: baseline_file2 is defined
      when: baseline_action == "compare"
      tags: [compare]

---
# Complete IDS deployment playbook
- name: Deploy POSIX IDS - Complete Installation
  hosts: ids_servers
  become: true
  gather_facts: true
  serial: "{{ rolling_update_batch_size | default(2) }}"
  max_fail_percentage: "{{ max_fail_percentage | default(25) }}"

  pre_tasks:
    - name: Display deployment information
      ansible.builtin.debug:
        msg:
          - "Deploying IDS version: {{ ids_version }}"
          - "Target host: {{ ansible_hostname }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Service type: {{ ids_service_type }}"
      tags: [always]

  # The configuration goes in before the monitor role, whose validation
  # runs the health check against it, and the baseline role reads the
  # CRITICAL_FILES list from it.
  roles:
    - role: ids_base
      tags: [base, install]

    - role: ids_config
      tags: [config]

    - role: ids_monitor
      tags: [monitor, install]

    - role: ids_baseline
      tags: [baseline]

  post_tasks:
    - name: Start the IDS
      ansible.builtin.include_role:
        name: ids_monitor
        tasks_from: start_service
      when: ids_service_state == "started"
      tags: [service]

    - name: Run the health check
      ansible.builtin.command: "{{ ids_base_path }}/bin/ids-healthcheck.sh"
      register: health_check
      changed_when: false
      failed_when: health_check.rc > 1
      tags: [validate]

    - name: Display health check results
      ansible.builtin.debug:
        var: health_check.stdout_lines
      tags: [validate]

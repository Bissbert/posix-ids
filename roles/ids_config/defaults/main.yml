---
# Settings the monitor reads from ids.conf. The defaults match
# config/ids.conf; the thresholds follow ids_thresholds in group_vars.
ids_alert_log: "{{ ids_log_path }}/alerts.json"
ids_monitor_log: "{{ ids_log_path }}/monitor.json"
ids_max_log_size: 10485760
ids_max_log_files: 5

ids_port_scan_threshold: "{{ ids_thresholds.port_scan_threshold | default(10) }}"
ids_brute_force_threshold: "{{ ids_thresholds.failed_login_threshold | default(5) }}"
ids_max_failed_logins: "{{ ids_thresholds.failed_login_threshold | default(5) }}"
ids_sudo_anomaly_threshold: 10
ids_auth_window: 300
ids_sudo_window: 3600
ids_outbound_port_whitelist: "22,80,443,53,123"

ids_critical_files:
  - /etc/passwd
  - /etc/shadow
  - /etc/sudoers
  - /etc/ssh/sshd_config
ids_critical_dirs: [/bin, /sbin, /usr/bin, /usr/sbin]
ids_web_dirs: [/var/www, /usr/share/nginx, /usr/share/apache2]

ids_cpu_threshold: "{{ ids_thresholds.cpu_warning | default(80) }}"
ids_mem_threshold: "{{ ids_thresholds.memory_critical | default(90) }}"
ids_disk_threshold: "{{ ids_thresholds.disk_critical | default(90) }}"
ids_proc_count_threshold: 500
ids_miner_patterns: "xmrig|minerd|minergate|ethminer|cgminer|bfgminer"
ids_check_interval: 60
ids_baseline_age_warn: 86400

ids_alert_to_syslog: true
ids_alert_to_file: true

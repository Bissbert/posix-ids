---
# Main tasks for ids_config role
- name: Deploy IDS configuration
  ansible.builtin.template:
    src: ids.conf.j2
    dest: "{{ ids_config_path }}/ids.conf"
    owner: "{{ ids_user }}"
    group: "{{ ids_group }}"
    mode: "0640"
    backup: yes
    validate: sh -n %s
  notify: restart ids
  tags: [config]

- name: Deploy threshold reference
  ansible.builtin.template:
    src: thresholds.conf.j2
    dest: "{{ ids_config_path }}/thresholds.conf"
    owner: "{{ ids_user }}"
    group: "{{ ids_group }}"
    mode: "0640"
  tags: [config]

# Source the file the way the monitor does and check the settings it
# cannot run without.
- name: Validate configuration
  ansible.builtin.shell: |
    set -eu
    . "{{ ids_config_path }}/ids.conf"
    for v in IDS_HOME BASELINE_FILE ALERT_LOG CRITICAL_FILES CHECK_INTERVAL; do
      eval "[ -n \"\${$v:-}\" ]" || { echo "missing $v"; exit 1; }
    done
  changed_when: false
  tags: [config, validate]

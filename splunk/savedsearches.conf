# Privilege Escalation (raw auth log; the IDS has no such check)
[Privilege Escalation Attempt]
search = index=security sourcetype=linux_secure ("FAILED su" OR "sudo:") | regex _raw="FAILED su|sudo:.*COMMAND=.*/bash"
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 1
action.email = 1


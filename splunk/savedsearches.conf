# Hidden Process Detection
[Hidden Process Detected]
search = index=security sourcetype=linux_ids category=process (description="Hidden process detected" OR description="Process running deleted binary")
dispatch.earliest_time = -10m
dispatch.latest_time = now
cron_schedule = */10 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 1

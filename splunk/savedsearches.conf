# Splunk saved searches and alerts for Linux IDS
# Place in $SPLUNK_HOME/etc/system/local/ or app directory
#
# sourcetype=linux_ids searches use the fields bin/monitor.sh writes
# (hostname, severity, category, description, details) and the ones
# splunk/props.conf extracts from details (src, file_path, process, pid,
# user, uid, attempt_count, usage_percent, dest_port). Each alert fires
# when the search returns at least one result.

# Critical Security Alert - Immediate notification
[IDS Critical Security Alert]
search = index=security sourcetype=linux_ids severity=critical | stats count by hostname, category, description
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 1
action.email = 1
action.email.to = security@example.com
action.email.subject = CRITICAL: IDS Alert on $result.hostname$
action.email.message.alert = Critical security event detected: $result.description$

# SSH Brute Force Detection (raw auth log)
[SSH Brute Force Attack]
search = index=security sourcetype=linux_secure "Failed password" | rex "from (?<src_ip>[0-9A-Fa-f.:]+) port" | stats count by src_ip, host | where count > 10
dispatch.earliest_time = -10m
dispatch.latest_time = now
cron_schedule = */10 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 2
action.email = 1
action.email.to = security@example.com
action.email.subject = SSH Brute Force Detected from $result.src_ip$

# SSH Brute Force as reported by the IDS
[IDS Brute Force Attack]
search = index=security sourcetype=linux_ids category=authentication description="Brute force attack detected" | stats max(attempt_count) as attempts by hostname, src
dispatch.earliest_time = -10m
dispatch.latest_time = now
cron_schedule = */10 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 2
action.email = 1

# New Root User Detection
[New Root Level User Created]
search = index=security sourcetype=linux_ids category=authentication description="New user created" uid=0 | dedup hostname, user
dispatch.earliest_time = -5m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 1
action.email = 1

# File Integrity Violation
[Critical File Modification]
search = index=security sourcetype=linux_ids category=filesystem (description="Critical file modified" OR description="New SUID/SGID file detected" OR description="Baseline file missing")
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 1
action.email = 1


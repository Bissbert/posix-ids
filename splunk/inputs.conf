# Splunk inputs.conf for Linux IDS
# Place in $SPLUNK_HOME/etc/system/local/ or app directory

# IDS alert records: one JSON object per line, written by bin/monitor.sh
# to ALERT_LOG in the configuration (default /var/log/ids/alerts.json).
# Rotated files are alerts.json.0 .. alerts.json.N; Splunk follows the
# rotation through the CRC check, so only the live file is monitored.
[monitor:///var/log/ids/alerts.json]
disabled = false
index = security
sourcetype = linux_ids

# System authentication logs
[monitor:///var/log/auth.log]
disabled = false
index = security
sourcetype = linux_secure
# Monitor in real-time for authentication events
followTail = 1

# Alternative for RHEL/CentOS
[monitor:///var/log/secure]
disabled = false
index = security
sourcetype = linux_secure
followTail = 1

# Kernel logs for privilege escalation detection
[monitor:///var/log/kern.log]
disabled = false
index = security
sourcetype = linux_kernel
followTail = 1

# System logs
[monitor:///var/log/syslog]
disabled = false
index = os
sourcetype = syslog
followTail = 1

# Apache access logs (if applicable)
[monitor:///var/log/apache2/access.log]
disabled = false
index = web
sourcetype = apache_access
followTail = 1

# Apache error logs
[monitor:///var/log/apache2/error.log]
disabled = false
index = web
sourcetype = apache_error
followTail = 1

# Nginx access logs (if applicable)
[monitor:///var/log/nginx/access.log]
disabled = false
index = web
sourcetype = nginx_access
followTail = 1

# Package management logs
[monitor:///var/log/apt/history.log]
disabled = false
index = os
sourcetype = linux_packages
followTail = 1

[monitor:///var/log/yum.log]
disabled = false
index = os
sourcetype = linux_packages
followTail = 1

# Firewall logs (UFW)
[monitor:///var/log/ufw.log]
disabled = false
index = security
sourcetype = linux_firewall
followTail = 1

# Custom iptables log (if configured)
[monitor:///var/log/iptables.log]
disabled = false
index = security
sourcetype = linux_firewall
followTail = 1

# Audit logs (if auditd is installed)
[monitor:///var/log/audit/audit.log]
disabled = false
index = security
sourcetype = linux_audit
followTail = 1

# The IDS has no scripted inputs: the monitor runs from cron, systemd or
# init and writes the alert log above, and Splunk only reads that file.

# Splunk props.conf for Linux IDS
# Place in $SPLUNK_HOME/etc/system/local/ or app directory
#
# bin/monitor.sh writes one JSON object per line:
#   {"timestamp":"2026-09-24T09:42:17Z","hostname":"web01","severity":"critical",
#    "category":"authentication","description":"Brute force attack detected",
#    "details":"IP: 203.0.113.9, Attempts: 12"}
# severity:  critical, high, medium, low, info
# category:  network, authentication, filesystem, process, resources, configuration
# details is free text; the EXTRACT lines below pull the values out of it.

[linux_ids]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 10000
KV_MODE = json
# The monitor stamps UTC with a literal Z (date -u +%Y-%m-%dT%H:%M:%SZ).
TIME_PREFIX = "timestamp":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
TZ = UTC
MAX_TIMESTAMP_LOOKAHEAD = 25

# Values carried in the details text
EXTRACT-ids_src = "details":"IP: (?<src>[0-9A-Fa-f.:]+)
EXTRACT-ids_file = "details":"(?:File: )?(?<file_path>/[^,"\s]+)
EXTRACT-ids_process = "details":"Process: (?<process>[^,"]+), PID: (?<pid>\d+)
EXTRACT-ids_pid = "details":"PID: (?<pid>\d+), CMD: (?<process>[^"]*)
EXTRACT-ids_user = "details":"User: (?<user>[^,"]+), UID: (?<uid>\d+)
EXTRACT-ids_count = (?:Attempts|Count|Connections): (?<attempt_count>\d+)
EXTRACT-ids_usage = Usage: (?<usage_percent>\d+)%
EXTRACT-ids_port = "details":"Port: (?<dest_port>\d+)

# Field aliases for CIM compliance
FIELDALIAS-ids_cim = hostname AS dest, description AS signature, category AS signature_type

# Severity mapping
EVAL-risk_score = case(severity="critical", 100, severity="high", 75, severity="medium", 50, severity="low", 25, 1==1, 0)
